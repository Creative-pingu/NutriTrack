<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack - Loading</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="/NutriTrack/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriTrack">
    <link rel="apple-touch-icon" href="/NutriTrack/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#3b82f6">
    <style>
        html, body {
            margin: 0; padding: 0; background: #0a0f1a; color: white;
            min-height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; overflow-x: hidden; overflow-y: auto;
        }
        #load-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0f1a; z-index: 9999;
        }
        #load-status {
            margin-top: 20px; font-size: 14px; color: #94a3b8;
            text-align: center; max-width: 80%;
        }
        #load-steps {
            margin-top: 30px; width: 80%;
        }
        .step {
            padding: 8px 12px; margin: 4px 0; border-radius: 6px;
            font-size: 13px; font-family: monospace;
        }
        .step.waiting { background: #1e293b; color: #64748b; }
        .step.loaded { background: #10b981; color: white; }
        .step.error { background: #ef4444; color: white; }
        .step.current { background: #3b82f6; color: white; }
        #error-detail {
            margin-top: 20px; padding: 15px; border-radius: 8px;
            background: #7c3aed; color: white; font-size: 12px;
            max-width: 80%; text-align: left; display: none;
        }
        #build-info {
            position: fixed; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 8px 12px;
            border-radius: 6px; font-size: 11px; color: #94a3b8;
            font-family: monospace; z-index: 10000;
        }
        #unregister-status {
            position: fixed; top: 10px; right: 10px;
            background: #3b82f6; color: white; padding: 6px 10px;
            border-radius: 4px; font-size: 11px; z-index: 10001;
        }
    </style>
</head>
<body>
    <div id="unregister-status">Unregistering old SW...</div>
    <div id="build-info">v52 - 2026-07-25 12:45 - NUCLEAR</div>
    <div id="load-container">
        <h2 style="color: #3b82f6; margin-bottom: 10px;">NutriTrack</h2>
        <div id="load-status">Clearing old service worker...</div>
        <div id="load-steps"></div>
        <div id="error-detail"></div>
    </div>

    <!-- CRITICAL: Unregister old service workers BEFORE anything else -->
    <script>
        // NUCLEAR OPTION: Unregister ALL service workers immediately
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                const count = registrations.length;
                Promise.all(registrations.map(function(r) { return r.unregister(); })).then(function() {
                    document.getElementById('unregister-status').textContent = 'Old SW cleared (' + count + ')';
                    document.getElementById('load-status').textContent = 'Initializing...';
                    
                    // Now load the rest
                    loadScripts();
                });
            }).catch(function(e) {
                document.getElementById('unregister-status').textContent = 'SW clear failed';
                document.getElementById('load-status').textContent = 'Initializing (SW clear failed)...';
                loadScripts();
            });
        } else {
            document.getElementById('unregister-status').style.display = 'none';
            loadScripts();
        }
        
        function loadScripts() {
            const steps = [];
            function addStep(name) {
                const el = document.createElement('div');
                el.className = 'step waiting';
                el.textContent = name;
                document.getElementById('load-steps').appendChild(el);
                steps.push({ name, el });
                return steps.length - 1;
            }
            function updateStep(idx, status, msg) {
                if (steps[idx]) {
                    steps[idx].el.className = 'step ' + status;
                    if (msg) steps[idx].el.textContent = steps[idx].name + ': ' + msg;
                }
            }
            function setStatus(msg) {
                document.getElementById('load-status').textContent = msg;
            }
            function showError(detail) {
                document.getElementById('error-detail').textContent = detail;
                document.getElementById('error-detail').style.display = 'block';
            }
            
            addStep('React');
            addStep('ReactDOM');
            addStep('Babel');
            addStep('Lucide');
            addStep('Setup globals');
            addStep('Fetch NutriTrack.jsx');
            addStep('Process code');
            addStep('Babel transform');
            addStep('Eval code');
            addStep('Render app');
            
            // Load scripts
            const script1 = document.createElement('script');
            script1.src = 'https://unpkg.com/react@18/umd/react.production.min.js?v=2';
            script1.onload = function() { updateStep(0, 'loaded'); };
            script1.onerror = function() { updateStep(0, 'error'); showError('React CDN failed'); };
            document.head.appendChild(script1);
            
            const script2 = document.createElement('script');
            script2.src = 'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js?v=2';
            script2.onload = function() { updateStep(1, 'loaded'); };
            script2.onerror = function() { updateStep(1, 'error'); showError('ReactDOM CDN failed'); };
            document.head.appendChild(script2);
            
            const script3 = document.createElement('script');
            script3.src = 'https://unpkg.com/@babel/standalone/babel.min.js?v=2';
            script3.onload = function() { updateStep(2, 'loaded'); };
            script3.onerror = function() { updateStep(2, 'error'); showError('Babel CDN failed'); };
            document.head.appendChild(script3);
            
            const script4 = document.createElement('script');
            script4.src = 'https://unpkg.com/lucide@0.344.0?v=2';
            script4.onload = function() { updateStep(3, 'loaded'); };
            script4.onerror = function() { updateStep(3, 'error'); };
            document.head.appendChild(script4);
            
            // Wait for scripts to load, then set up globals
            const checkReady = setInterval(function() {
                if (window.React && window.ReactDOM && window.Babel) {
                    clearInterval(checkReady);
                    updateStep(4, 'current', 'Setting up...');
                    try {
                        window.useState = React.useState;
                        window.useEffect = React.useEffect;
                        window.useMemo = React.useMemo;
                        window.useCallback = React.useCallback;
                        window.useRef = React.useRef;
                        if (window.lucide) {
                            Object.assign(window, window.lucide);
                            window['lucide-react'] = window.lucide;
                        }
                        window.storage = {
                            get: async (k) => ({ value: localStorage.getItem(k) }),
                            set: async (k, v) => { localStorage.setItem(k, v); return v; },
                            delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
                        };
                        updateStep(4, 'loaded');
                        startApp();
                    } catch (e) {
                        updateStep(4, 'error');
                        showError('Globals failed: ' + e.message);
                    }
                }
            }, 100);
            
            function startApp() {
                updateStep(5, 'current', 'Fetching...');
                fetch('./NutriTrack.jsx?v=52')
                    .then(function(res) {
                        updateStep(5, 'loaded', 'Status: ' + res.status);
                        return res.text();
                    })
                    .then(function(code) {
                        updateStep(6, 'loaded', code.length + ' chars');
                        code = code.replace(/exports+default/g, 'window._MainApp = ');
                        const lines = code.split('
');
                        code = lines.filter(function(line) {
                            return !line.trim().startsWith('import ') && !line.trim().startsWith('export ');
                        }).join('
');
                        updateStep(7, 'loaded');
                        
                        updateStep(8, 'current', 'Transforming...');
                        try {
                            const transformed = Babel.transform(code, { 
                                presets: ['react', ['env', { modules: false }]] 
                            }).code;
                            updateStep(8, 'loaded');
                            
                            updateStep(9, 'current', 'Executing...');
                            eval(transformed);
                            updateStep(9, 'loaded');
                            
                            updateStep(10, 'current', 'Rendering...');
                            const App = window._MainApp || (typeof NutriTrack !== 'undefined' ? NutriTrack : null);
                            if (App) {
                                const root = ReactDOM.createRoot(document.createElement('div'));
                                document.getElementById('load-container').style.display = 'none';
                                document.body.appendChild(root._internalRootFiber.stateNode.containerInfo);
                                root.render(React.createElement(App));
                                updateStep(10, 'loaded', 'Success!');
                                setStatus('NutriTrack loaded successfully');
                            } else {
                                throw new Error('App not found');
                            }
                        } catch (e) {
                            updateStep(10, 'error');
                            showError('Error: ' + e.message);
                            setStatus('ERROR');
                        }
                    })
                    .catch(function(e) {
                        updateStep(10, 'error');
                        showError('Fetch failed: ' + e.message);
                        setStatus('ERROR');
                    });
            }
        }
        
        // Start the unregister process
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                Promise.all(registrations.map(function(r) { return r.unregister(); })).then(function() {
                    // Reload to ensure clean state
                    setTimeout(function() {
                        window.location.reload();
                    }, 1000);
                });
            });
        }
    </script>
</body>
</html>
