<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/NutriTrack/manifest.webmanifest">

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriTrack">
    <link rel="apple-touch-icon" href="/NutriTrack/icons/apple-touch-icon.png">

    <!-- Theme colour -->
    <meta name="theme-color" content="#3b82f6">

    <style>
        html, body { 
            margin: 0; 
            padding: 0;
            background: #0a0f1a; 
            color: white; 
            min-height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #root { 
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0f1a;
            z-index: 9999;
            color: #64748b;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.344.0"></script>

    <script>
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useMemo = React.useMemo;
        window.useCallback = React.useCallback;
        window.useRef = React.useRef;
        
        if (window.lucide) {
            Object.assign(window, window.lucide);
            window['lucide-react'] = window.lucide;
        }

        window.storage = {
            get: async (k) => ({ value: localStorage.getItem(k) }),
            set: async (k, v) => { localStorage.setItem(k, v); return v; },
            delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
        };
    </script>
</head>
<body>
    <div id="root">
        <div id="loading-screen">Launching NutriTrack...</div>
    </div>

    <script type="text/babel">
        async function loadApp() {
            try {
                const res = await fetch('./NutriTrack.jsx');
                let code = await res.text();

                // Line-based import/export stripping
                const lines = code.split('
');
                code = lines.filter(line => !line.trim().startsWith('import ') && !line.trim().startsWith('export ')).join('
');
                code = code.replace(/exports+default/g, 'window._MainApp = ');

                const transformed = Babel.transform(code, { 
                    presets: ['react', ['env', { modules: false }]] 
                }).code;

                eval(transformed);

                const App = window._MainApp || (typeof NutriTrack !== 'undefined' ? NutriTrack : null);
                
                if (App) {
                    const root = ReactDOM.createRoot(document.getElementById("root"));
                    document.getElementById('root').innerHTML = '';
                    root.render(React.createElement(App));
                }
            } catch (e) {
                document.getElementById('root').innerHTML = '<div style="padding:20px; color:red;">Error: ' + e.message + '</div>';
            }
        }
        loadApp();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/NutriTrack/sw.js', { scope: '/NutriTrack/' })
                    .then(reg => {
                        console.log('[NutriTrack] SW registered');
                        fetch('/NutriTrack/sw.js', { cache: 'no-store' })
                            .then(() => reg.update())
                            .catch(() => reg.update());
                    })
                    .catch(err => console.warn('[NutriTrack] SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
