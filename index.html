<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack - Loading</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="/NutriTrack/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriTrack">
    <link rel="apple-touch-icon" href="/NutriTrack/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#3b82f6">
    <style>
        html, body {
            margin: 0; padding: 0; background: #0a0f1a; color: white;
            min-height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; overflow-x: hidden; overflow-y: auto;
        }
        #load-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0f1a; z-index: 9999;
        }
        #load-status {
            margin-top: 20px; font-size: 14px; color: #94a3b8;
            text-align: center; max-width: 80%;
        }
        #load-steps {
            margin-top: 30px; width: 80%;
        }
        .step {
            padding: 8px 12px; margin: 4px 0; border-radius: 6px;
            font-size: 13px; font-family: monospace;
        }
        .step.waiting { background: #1e293b; color: #64748b; }
        .step.loaded { background: #10b981; color: white; }
        .step.error { background: #ef4444; color: white; }
        .step.current { background: #3b82f6; color: white; }
        #error-detail {
            margin-top: 20px; padding: 15px; border-radius: 8px;
            background: #7c3aed; color: white; font-size: 12px;
            max-width: 80%; text-align: left; display: none;
        }
        #build-info {
            position: fixed; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 8px 12px;
            border-radius: 6px; font-size: 11px; color: #94a3b8;
            font-family: monospace; z-index: 10000;
            display: none; /* developer aid - hidden in production */
        }
        #sw-status {
            position: fixed; top: 10px; right: 10px;
            background: #3b82f6; color: white; padding: 6px 10px;
            border-radius: 4px; font-size: 11px; z-index: 10001;
            display: none; /* developer aid - hidden in production */
        }
        #load-steps {
            margin-top: 30px; width: 80%;
            display: none; /* checklist logged to console instead */
        }
    </style>
    <!-- Phase 7b: static <script defer> tags replace the runtime CDN
         injection + dynamic-execution flow. defer preserves execution order
         (React -> ReactDOM -> NutriTrack.js -> inline init). NutriTrack.js
         is pre-compiled from NutriTrack.jsx at build time (Babel classic
         runtime); Babel is no longer loaded at runtime. -->
    <!-- Set APP_VERSION synchronously before the defer scripts run;
         NutriTrack.js reads window.APP_VERSION at load time. -->
    <script>window.APP_VERSION = 'v61';</script>
    <script defer src="https://unpkg.com/react@18/umd/react.production.min.js?v=4"></script>
    <script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js?v=4"></script>
    <script defer src="./NutriTrack.js?v=61"></script>
</head>
<body>
    <div id="sw-status">SW: Checking...</div>
    <div id="build-info">v61 - 2026-08-17 00:00</div>
    <div id="load-container">
        <h2 style="color: #3b82f6; margin-bottom: 10px;">NutriTrack</h2>
        <div id="load-status">Initializing...</div>
        <div id="load-steps"></div>
        <div id="error-detail"></div>
    </div>

    <script defer>
        // This defer script runs after the <head> defer scripts
        // (React -> ReactDOM -> NutriTrack.js) have all loaded and
        // executed, so React, ReactDOM, and window._MainApp are ready.
        // Phase 7b: NutriTrack.js is pre-compiled JSX loaded as a static
        // script (no fetch+eval, no Babel at runtime - S2/R12 resolved).

        const APP_VERSION = window.APP_VERSION;

        function setStatus(msg) {
            document.getElementById('load-status').textContent = msg;
        }
        function showError(detail) {
            document.getElementById('error-detail').textContent = detail;
            document.getElementById('error-detail').style.display = 'block';
        }
        console.log('[NutriTrack] init: React', typeof React, 'ReactDOM', typeof ReactDOM, '_MainApp', typeof window._MainApp);

        // Register the SW exactly once per load (do NOT unregister here -
        // unregistering on every load defeats the Phase 6d update detection
        // in NutriTrack.jsx, since there is never a waiting SW to detect).
        // The SW serves index.html network-first (never cached), so the
        // newest index.html always loads; code updates then propagate through
        // the SW's own lifecycle (updatefound -> controllerchange).
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/NutriTrack/sw.js?v=' + APP_VERSION, { scope: '/NutriTrack/' })
                .then(function(reg) {
                    document.getElementById('sw-status').textContent = 'SW: ' + APP_VERSION + ' active';
                    // Expose the ready promise so NutriTrack.js's Phase 6d
                    // update detection can reuse it without racing.
                    window._swReady = navigator.serviceWorker.ready;
                })
                .catch(function(err) {
                    document.getElementById('sw-status').textContent = 'SW: Reg failed';
                });
        } else {
            document.getElementById('sw-status').textContent = 'SW: Not supported';
        }

        try {
            if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
                throw new Error('React/ReactDOM failed to load from CDN');
            }
            // Expose hooks + storage on window for NutriTrack.js (classic
            // runtime compiles JSX to React.createElement, and the hooks
            // are referenced as bare globals per the app's convention).
            window.useState = React.useState;
            window.useEffect = React.useEffect;
            window.useMemo = React.useMemo;
            window.useCallback = React.useCallback;
            window.useRef = React.useRef;
            window.storage = {
                get: async (k) => ({ value: localStorage.getItem(k) }),
                set: async (k, v) => { localStorage.setItem(k, v); return v; },
                delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
            };

            const App = window._MainApp || (typeof NutriTrack !== 'undefined' ? NutriTrack : null);
            if (App) {
                const container = document.createElement('div');
                document.getElementById('load-container').style.display = 'none';
                document.body.appendChild(container);
                const root = ReactDOM.createRoot(container);
                root.render(React.createElement(App));
                setStatus('NutriTrack loaded successfully');
            } else {
                throw new Error('App component not found in NutriTrack.js');
            }
        } catch (e) {
            showError('Error: ' + e.message + '\n\n' + (e.stack || '').substring(0, 300));
            setStatus('ERROR');
        }
    </script>
</body>
</html>
