<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/NutriTrack/manifest.webmanifest">

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriTrack">
    <link rel="apple-touch-icon" href="/NutriTrack/icons/apple-touch-icon.png">

    <!-- Theme colour (Android / Chrome) -->
    <meta name="theme-color" content="#3b82f6">

    <style>
        /* Restore scrolling and touch interaction */
        html, body {
            margin: 0;
            padding: 0;
            background: #0a0f1a;
            color: white;
            /* min-height instead of fixed height allows natural scrolling */
            min-height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Removes the grey flicker when tapping buttons on iOS */
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #loading-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0f1a;
            z-index: 9999;
            color: #64748b;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        // Load and transform NutriTrack.jsx
        async function loadApp() {
            try {
                // Force reload if CACHE_VERSION bumping in sw.js. See Phase 6d notes.
                const res = await fetch('./NutriTrack.jsx');
                let code = await res.text();

                // Clean for browser execution
                code = code.replace(/import\s+[\s\S]+?from\s+['"].+?['"];/g, '// Stripped');
                code = code.replace(/export\s+default/g, 'window._MainApp = ');

                const transformed = Babel.transform(code, {
                    presets: ['react', ['env', { modules: false }]]
                }).code;

                eval(transformed);

                const App = window._MainApp || (typeof NutriTrack !== 'undefined' ? NutriTrack : null);

                if (App) {
                    const root = ReactDOM.createRoot(document.getElementById("root"));
                    // Clear the loading screen before rendering
                    document.getElementById('root').innerHTML = '';
                    root.render(React.createElement(App));
                }
            } catch (e) {
                document.getElementById('root').innerHTML = `<div style="padding:20px; color:red;">${e.message}</div>`;
            }
        }
        loadApp();
    </script>

    <script>
        // Phase 6d — Service Worker registration
        // Registered after app load to avoid competing with initial resource fetches.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // Fetch sw.js to extract CACHE_VERSION
                    const swResponse = await fetch('/NutriTrack/sw.js', { cache: 'no-store' });

                    const swContent = await swResponse.text();

                    // Extract CACHE_VERSION using regex
                    const versionMatch = swContent.match(/const CACHE_VERSION = "([^"]+)"/);
                    const cacheVersion = versionMatch ? versionMatch[1] : null;

                    if (cacheVersion) {
                        // Register SW with the extracted version as a query string
                        const swUrl = `/NutriTrack/sw.js?v=${cacheVersion}`;
                        const reg = await navigator.serviceWorker.register(swUrl, { scope: '/NutriTrack/' });
                        console.log('[NutriTrack] SW registered, scope:', reg.scope);
                        // Trigger update check on every page load
                        reg.update();
                    } else {
                        console.warn('[NutriTrack] Could not extract CACHE_VERSION from sw.js');
                    }
                } catch (err) {
                    console.warn('[NutriTrack] Failed to fetch sw.js or register SW:', err);
                }
            });
        }
    </script>
</body>
</html>
