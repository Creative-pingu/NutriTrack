<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NutriTrack - Loading</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="/NutriTrack/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriTrack">
    <link rel="apple-touch-icon" href="/NutriTrack/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#3b82f6">
    <style>
        html, body {
            margin: 0; padding: 0; background: #0a0f1a; color: white;
            min-height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; overflow-x: hidden; overflow-y: auto;
        }
        #load-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0f1a; z-index: 9999;
        }
        #load-status {
            margin-top: 20px; font-size: 14px; color: #94a3b8;
            text-align: center; max-width: 80%;
        }
        #load-steps {
            margin-top: 30px; width: 80%;
        }
        .step {
            padding: 8px 12px; margin: 4px 0; border-radius: 6px;
            font-size: 13px; font-family: monospace;
        }
        .step.waiting { background: #1e293b; color: #64748b; }
        .step.loaded { background: #10b981; color: white; }
        .step.error { background: #ef4444; color: white; }
        .step.current { background: #3b82f6; color: white; }
        #error-detail {
            margin-top: 20px; padding: 15px; border-radius: 8px;
            background: #7c3aed; color: white; font-size: 12px;
            max-width: 80%; text-align: left; display: none;
        }
        #build-info {
            position: fixed; bottom: 10px; right: 10px;
            background: rgba(0,0,0,0.7); padding: 8px 12px;
            border-radius: 6px; font-size: 11px; color: #94a3b8;
            font-family: monospace; z-index: 10000;
        }
        #sw-status {
            position: fixed; top: 10px; right: 10px;
            background: #3b82f6; color: white; padding: 6px 10px;
            border-radius: 4px; font-size: 11px; z-index: 10001;
        }
    </style>
</head>
<body>
    <div id="sw-status">Checking SW...</div>
    <div id="build-info">v53 - 2026-07-25 12:55</div>
    <div id="load-container">
        <h2 style="color: #3b82f6; margin-bottom: 10px;">NutriTrack</h2>
        <div id="load-status">Initializing...</div>
        <div id="load-steps"></div>
        <div id="error-detail"></div>
    </div>

    <script>
        // Setup step tracking
        const steps = [];
        function addStep(name) {
            const el = document.createElement('div');
            el.className = 'step waiting';
            el.textContent = name;
            document.getElementById('load-steps').appendChild(el);
            steps.push({ name, el });
            return steps.length - 1;
        }
        function updateStep(idx, status, msg) {
            if (steps[idx]) {
                steps[idx].el.className = 'step ' + status;
                if (msg) steps[idx].el.textContent = steps[idx].name + ': ' + msg;
            }
        }
        function setStatus(msg) {
            document.getElementById('load-status').textContent = msg;
        }
        function showError(detail) {
            document.getElementById('error-detail').textContent = detail;
            document.getElementById('error-detail').style.display = 'block';
        }
        
        // Initialize steps
        addStep('React');
        addStep('ReactDOM');
        addStep('Babel');
        addStep('Lucide');
        addStep('Setup globals');
        addStep('Fetch NutriTrack.jsx');
        addStep('Process code');
        addStep('Babel transform');
        addStep('Eval code');
        addStep('Render app');
        
        // Unregister old service workers
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                document.getElementById('sw-status').textContent = 'Found ' + registrations.length + ' SW(s)';
                return Promise.all(registrations.map(function(r) { 
                    return r.unregister().then(function() {
                        document.getElementById('sw-status').textContent = 'SW unregistered';
                    });
                }));
            }).catch(function(e) {
                document.getElementById('sw-status').textContent = 'SW check failed';
            });
        } else {
            document.getElementById('sw-status').textContent = 'No SW API';
        }
        
        // Load scripts dynamically
        function loadScript(src, stepIdx, name) {
            return new Promise(function(resolve, reject) {
                const script = document.createElement('script');
                script.src = src;
                script.onload = function() {
                    updateStep(stepIdx, 'loaded');
                    resolve();
                };
                script.onerror = function() {
                    updateStep(stepIdx, 'error');
                    showError(name + ' CDN failed to load');
                    reject(new Error(name + ' failed'));
                };
                document.head.appendChild(script);
            });
        }
        
        // Load all CDN scripts
        Promise.all([
            loadScript('https://unpkg.com/react@18/umd/react.production.min.js?v=3', 0, 'React'),
            loadScript('https://unpkg.com/react-dom@18/umd/react-dom.production.min.js?v=3', 1, 'ReactDOM'),
            loadScript('https://unpkg.com/@babel/standalone/babel.min.js?v=3', 2, 'Babel'),
            loadScript('https://unpkg.com/lucide@0.344.0?v=3', 3, 'Lucide')
        ]).then(function() {
            // All scripts loaded, set up globals
            updateStep(4, 'current', 'Setting up...');
            try {
                window.useState = React.useState;
                window.useEffect = React.useEffect;
                window.useMemo = React.useMemo;
                window.useCallback = React.useCallback;
                window.useRef = React.useRef;
                if (window.lucide) {
                    Object.assign(window, window.lucide);
                    window['lucide-react'] = window.lucide;
                }
                window.storage = {
                    get: async (k) => ({ value: localStorage.getItem(k) }),
                    set: async (k, v) => { localStorage.setItem(k, v); return v; },
                    delete: async (k) => { localStorage.removeItem(k); return { deleted: true }; }
                };
                updateStep(4, 'loaded');
                loadApp();
            } catch (e) {
                updateStep(4, 'error');
                showError('Globals failed: ' + e.message);
            }
        }).catch(function() {
            // At least one script failed
            setStatus('Some scripts failed - check errors above');
        });
        
        function loadApp() {
            updateStep(5, 'current', 'Fetching...');
            fetch('./NutriTrack.jsx?v=53')
                .then(function(res) {
                    updateStep(5, 'loaded', 'Status: ' + res.status);
                    return res.text();
                })
                .then(function(code) {
                    updateStep(6, 'loaded', code.length + ' chars');
                    
                    updateStep(7, 'current', 'Processing...');
                    code = code.replace(/exports+default/g, 'window._MainApp = ');
                    const lines = code.split('
');
                    code = lines.filter(function(line) {
                        return !line.trim().startsWith('import ') && !line.trim().startsWith('export ');
                    }).join('
');
                    updateStep(7, 'loaded');
                    
                    updateStep(8, 'current', 'Transforming...');
                    try {
                        const transformed = Babel.transform(code, { 
                            presets: ['react', ['env', { modules: false }]] 
                        }).code;
                        updateStep(8, 'loaded');
                        
                        updateStep(9, 'current', 'Executing...');
                        eval(transformed);
                        updateStep(9, 'loaded');
                        
                        updateStep(10, 'current', 'Rendering...');
                        const App = window._MainApp || (typeof NutriTrack !== 'undefined' ? NutriTrack : null);
                        if (App) {
                            const container = document.createElement('div');
                            document.getElementById('load-container').style.display = 'none';
                            document.body.appendChild(container);
                            const root = ReactDOM.createRoot(container);
                            root.render(React.createElement(App));
                            updateStep(10, 'loaded', 'Success!');
                            setStatus('NutriTrack loaded successfully');
                        } else {
                            throw new Error('App not found: window._MainApp = ' + typeof window._MainApp);
                        }
                    } catch (e) {
                        updateStep(10, 'error');
                        showError('Error: ' + e.message + '

' + (e.stack || '').substring(0, 300));
                        setStatus('ERROR - See details below');
                    }
                })
                .catch(function(e) {
                    updateStep(10, 'error');
                    showError('Fetch failed: ' + e.message);
                    setStatus('ERROR');
                });
        }
        
        // Register new service worker after everything loads
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                setTimeout(function() {
                    navigator.serviceWorker.register('/NutriTrack/sw.js?v=53', { scope: '/NutriTrack/' })
                        .then(function(reg) {
                            document.getElementById('sw-status').textContent = 'SW v53 registered';
                            fetch('/NutriTrack/sw.js?v=53', { cache: 'no-store' }).then(function() { 
                                reg.update(); 
                            }).catch(function() { reg.update(); });
                        })
                        .catch(function(err) {
                            document.getElementById('sw-status').textContent = 'SW reg failed';
                        });
                }, 2000);
            });
        }
    </script>
</body>
</html>
